[package]
name = "voidb-plugin-duckdb"
version = "0.3.4"
edition = "2024"
license = "Apache-2.0"
authors = ["limmytian <limmytian@gmail.com>"]
description = "Standalone VoidB process plugin for DuckDB analytical database"
repository = "https://github.com/limmytian/voidb-plugin-duckdb"

[[bin]]
name = "voidb-plugin-duckdb"
path = "src/main.rs"

[dependencies]
voidb-process-plugin-sdk = { git = "https://github.com/limmytian/voidb.git", rev = "31d22cd09c9b10f1d22f59d47e789a49c33a290d" }
voidb-core = { git = "https://github.com/limmytian/voidb.git", rev = "31d22cd09c9b10f1d22f59d47e789a49c33a290d", default-features = false }
duckdb = { version = "1.4", features = ["bundled"] }
async-trait = "0.1"
tracing = "0.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
hex = "0.4"
rpassword = "7"

[dev-dependencies]
toml = "0.8"
